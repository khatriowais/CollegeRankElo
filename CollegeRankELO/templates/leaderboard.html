{% extends "_base.html" %}
{% set active = 'leaderboard' %}
{% block title %}Leaderboard · CollegeRankELO{% endblock %}
{% block body %}
<h1>Leaderboard</h1>
<div class="filters card">
  <input id="lbSearch" type="search" placeholder="Search…" />
  <select id="lbType">
    <option value="">All types</option><option>Government</option><option>Private</option>
  </select>
  <select id="lbCity"><option value="">All cities</option></select>
  <select id="lbSort">
    <option value="elo_rating">Sort: Elo</option>
    <option value="roi">Sort: ROI</option>
    <option value="average_package">Sort: Package</option>
    <option value="placement_percentage">Sort: Placement %</option>
    <option value="annual_fee_asc">Sort: Fees (low→high)</option>
    <option value="naac">Sort: NAAC</option>
  </select>
</div>

<div class="card">
  <table class="leaderboard">
    <thead>
      <tr><th>#</th><th>College</th><th>Elo</th><th>Avg Package</th><th>Placement %</th><th>Fees</th><th>ROI</th><th>NAAC</th></tr>
    </thead>
    <tbody id="lbBody"></tbody>
  </table>
  <div class="pagination">
    <button id="prevPage" class="page-btn" type="button" aria-label="Previous page"><span aria-hidden="true">←</span> Previous</button>
    <span id="pageInfo"></span>
    <button id="nextPage" class="page-btn" type="button" aria-label="Next page">Next <span aria-hidden="true">→</span></button>
  </div>
</div>

<script id="collegesData" type="application/json">{{ colleges|tojson }}</script>
{% endblock %}
{% block scripts %}
<script>
  window.__COLLEGES__ = JSON.parse(document.getElementById('collegesData').textContent);
</script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script>initLeaderboard();</script>
{% endblock %}
